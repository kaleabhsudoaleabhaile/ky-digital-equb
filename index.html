DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <h2>💸 K Y Digital Equb</h2>
      <p>የእርስዎ ታማኝ ዲጂታል ዕቁብ ማኔጀር</p>
    </header>

    <!-- Stats -->
    <div class="card stats-card">
      <div class="stat-box">
        <span class="stat-icon">👥</span>
        <div>
          <small>አጠቃላይ አባላት</small>
          <h3 id="totalMembersCount">0</h3>
        </div>
      </div>
    </div>

    <!-- Add Member Form -->
    <div class="card">
      <h3>👤+ አዲስ አባል መመዝገቢያ (Admin)</h3>
      <div class="form-group">
        <input type="text" id="memberNameInput" placeholder="የአባል ስም እና አባት ስም" required>
      </div>
      <div class="form-group">
        <select id="memberGenderInput" class="form-control" style="width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 5px;">
          <option value="ወንድ">ወንድ</option>
          <option value="ሴት">ሴት</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" value="ቋሚ የዕቁብ መጠን: 50 ብር" disabled style="opacity: 0.8; font-weight: bold;">
      </div>
      <button class="btn btn-primary" onclick="addMember()">አባል አስገባ</button>
    </div>

    <!-- Live Draw Section -->
    <div class="card">
      <h3>🏆 የቀጥታ (Live) እጣ ማውጫ</h3>
      <div class="draw-box" id="drawDisplay">
        <p id="winnerText">🎲 እጣ ለማውጣት ከታች ያለውን በተን ይጫኑ</p>
      </div>
      <button class="btn btn-accent" id="spinBtn" onclick="triggerLiveSpin()">🔀 እጣ አውጣ!</button>
    </div>

    <!-- Members Table -->
    <div class="card">
      <h3>📑 የአባላት የ 5 ቀናት ክፍያ ሰንጠረዥ</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ስም</th>
              <th>ፆታ</th>
              <th>መጠን</th>
              <th>ቀን 1</th>
              <th>ቀን 2</th>
              <th>ቀን 3</th>
              <th>ቀን 4</th>
              <th>ቀን 5</th>
              <th>እጣ</th>
              <th>እርምጃ</th>
            </tr>
          </thead>
          <tbody id="membersList">
            <!-- አባላት እዚህ ይደረደራሉ -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
